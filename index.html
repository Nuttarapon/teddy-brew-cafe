<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Brew Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="home-body">

    <!-- ป้ายต้อนรับด้านบน -->
    <div class="audio-banner">
        🧸 Welcome to Teddy Brew Cafe ☕
    </div>

    <div class="shop-container">
        <!-- หน้าต่างร้านคาเฟ่ คลิกเพื่อไปเลือกเมนู -->
        <a href="drink.html" class="shop-window-link">
            <div class="shop-building">
                <div class="awning"></div>
                
                <!-- หน้าต่างกระจกโชว์ขนมและน้องหมี -->
                <div class="glass-window">
                    <div class="shelf">🧸 ☕ 🥐</div>
                </div>

                <!-- ประตูร้านพร้อมป้าย Order Here -->
                <div class="door">
                    <div class="order-tag-door">Order Here</div>
                </div>
            </div>
        </a>
    </div>

</body>
</html>
