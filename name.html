<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Order Tag - Teddy Brew Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="menu-body">

    <div class="menu-container-small text-center">
        <div class="input-section">
            <label for="nameInput" class="input-label">พิมพ์ชื่อของคุณสำหรับ Order นี้ <span class="required">*</span></label>
            <input type="text" id="nameInput" class="styled-input" placeholder="กรอกชื่อของคุณที่นี่" maxlength="15">
            <p id="nameErrorMsg" class="error-msg hidden">กรุณากรอกชื่อก่อนยืนยันออเดอร์ครับ 🧸</p>
        </div>

        <div class="input-section">
            <label for="noteInput" class="input-label">หมายเหตุเพิ่มเติม (ถ้ามี):</label>
            <input type="text" id="noteInput" class="styled-input note-input" placeholder="เช่น ไม่รับหลอด, แยกน้ำแข็ง" maxlength="40">
        </div>

        <!-- ป้ายกระดาษจำลองชื่อลูกค้า -->
        <div class="order-tag-card">
            <p class="tag-title">ORDER FOR</p>
            <h1 id="customerName" class="customer-name-display">Your Name</h1>
            <p id="tagDateTime" class="tag-datetime"></p>
            <div class="tag-divider"></div>
            
            <div id="selectedDrinkList" class="selected-drink-list"></div>
            <div id="tagNoteDisplay" class="tag-note-display hidden"></div>
            <div id="totalPriceDisplay" class="total-price-display"></div>

            <div class="tag-divider"></div>
            <div class="tag-footer-info">
                <span>TEDDY BREW 🧸</span>
                <span id="orderNumberDisplay">ORDER #001</span>
            </div>
        </div>

        <div class="action-footer">
            <button id="finishBtn" class="choose-btn">ยืนยันการสั่งซื้อ</button>
            <br>
            <a href="drink.html" class="back-link">← เลือกเมนูเพิ่ม / แก้ไขรายการ</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
